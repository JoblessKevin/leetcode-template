name: cpp

on:
  push:
    branches: [ main, master ]
    paths: [ 'cpp/**', '.github/workflows/cpp.yml' ]
  pull_request:
    paths: [ 'cpp/**', '.github/workflows/cpp.yml' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cpp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Configure with CMake (GoogleTest is fetched automatically)
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      # Run all GoogleTest cases
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      # Check code style with a pinned clang-format (the preinstalled one may format differently)
      - name: Check code style
        run: |
          pip install clang-format==23.1.3
          find problems templates traps -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror
